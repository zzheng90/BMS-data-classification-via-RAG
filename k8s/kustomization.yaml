apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bms-rag

resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml

# The deploy pipeline patches the image tag via:
#   kubectl kustomize . | sed "s#image: bms-rag:dev#image: <GHCR_URL>:sha-<git-sha>#"
# (see .github/workflows/ci-cd.yml, deploy job)
images:
  - name: bms-rag
    newName: bms-rag
    newTag: dev

labels:
  - pairs:
      managed-by: kustomize
    includeSelectors: false
