apiVersion: v1
kind: ConfigMap
metadata:
  name: bms-rag-config
  namespace: bms-rag
data:
  # Non-secret runtime configuration. Must match the models baked into the
  # image (see Dockerfile) or the container will try to download at startup.
  BMS_RAG_EMBED_MODEL: "BAAI/bge-small-en-v1.5"
  BMS_RAG_RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  BMS_RAG_DATA_DIR: "sample_data"
  BMS_RAG_STORAGE_DIR: "/tmp/storage"
  DASHSCOPE_BASE_URL: "https://llm-f09ekvv7w0ioviiw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  DASHSCOPE_MODEL: "qwen-plus"
