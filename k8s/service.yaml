apiVersion: v1
kind: Service
metadata:
  name: bms-rag
  namespace: bms-rag
  labels:
    app: bms-rag
spec:
  type: NodePort
  selector:
    app: bms-rag
  ports:
    - name: http
      port: 80
      targetPort: http
      # Fixed NodePort so the AWS security group / URL is stable.
      nodePort: 30080
