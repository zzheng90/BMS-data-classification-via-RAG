# EXAMPLE ONLY — do not commit a real key.
#
# Local (kind):
#   kubectl -n bms-rag create secret generic bms-rag-secrets \
#     --from-literal=DASHSCOPE_API_KEY=sk-your-real-key
#
# In CI the deploy job creates/updates this secret from a GitHub Actions secret.
apiVersion: v1
kind: Secret
metadata:
  name: bms-rag-secrets
  namespace: bms-rag
type: Opaque
stringData:
  DASHSCOPE_API_KEY: "replace_with_your_dashscope_key"
