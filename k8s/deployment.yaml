apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-rag
  namespace: bms-rag
  labels:
    app: bms-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bms-rag
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bms-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bms-rag
          # kustomize overrides the image tag per environment.
          image: bms-rag:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: bms-rag-config
            - secretRef:
                name: bms-rag-secrets
                # App still starts without it; predictions just error until set.
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            # Allow up to 2.5 min for the first model load + index build.
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
